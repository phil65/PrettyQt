name: Python package

on: [push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        # qt-binding: ["pyside6", "pyqt6"]
    runs-on: ${{ matrix.platform }}
    # 3.15 is a pre-release: test it early, but don't let it block the build.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    timeout-minutes: 60
    env:
      DISPLAY: ":99.0"
      UV_PYTHON: ${{ matrix.python-version }}
      # QtWebEngine segfaults on headless Linux runners with GPU / sandbox enabled
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox"
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: tlambert03/setup-qt-libs@v1
      # *alternative*:
      # - uses: pyvista/setup-headless-display-action@v2
      #   with:
      #     qt: true
      - name: Linux opengl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libpulse0

      # - name: start TextToSpeech service
      #   if: runner.os == 'Linux'
      #   run: |
      #     sudo apt-get install speech-dispatcher espeak
      #     speech-dispatcher -d

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync

      - name: Test with pytest  (PyQt6)
        # combine test coverage with --cov-append?
        uses: coactions/setup-xvfb@v1
        timeout-minutes: 5
        with:
          run: |
            uv sync --extra pyqt6 --extra addons
            uv run pytest

      - name: Test with pytest (PySide6)
        uses: coactions/setup-xvfb@v1
        # if: runner.os == 'Linux'
        timeout-minutes: 5
        with:
          run: |
            uv sync --extra pyside6 --extra addons
            uv run pytest --doctest-modules --junitxml=junit/test-results.xml --cov=prettyqt --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Create documentation
        # generating a page per class is slow, so only build docs once
        if: matrix.python-version == '3.13' && runner.os == 'Linux'
        uses: coactions/setup-xvfb@v1
        timeout-minutes: 40
        with:
          run: |
            uv sync --extra pyside6 --extra addons
            uv run mkdocs-mknodes build

  deploy:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write  # push the docs to gh-pages
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install packages
        run: |
          uv sync --extra pyside6 --extra addons

      - name: Build package
        run: |
          uv build

      - name: Publish package on PyPI
        run: |
          uv publish

      - name: Build documentation
        uses: coactions/setup-xvfb@v1
        timeout-minutes: 40
        with:
          run: |
            uv run mkdocs-mknodes build

      # - name: Publish package on GitHub
      #   # if: github.event_name == 'push'
      #   uses: mhausenblas/mkdocs-deploy-gh-pages@master
      #   # Or use mhausenblas/mkdocs-deploy-gh-pages@nomaterial to build without the mkdocs-material theme
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     # CUSTOM_DOMAIN: optionaldomain.com

      - name: Deploy docs to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
