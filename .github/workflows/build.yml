name: Build

on: [push, pull_request]

env:
  FORCE_COLOR: 1
  RUFF_OUTPUT_FORMAT: github

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The newest entry is a CPython pre-release: test it early, but don't let it block the build.
    # When a new CPython ships: bump this version and the matrix range end (stable versions must pass).
    continue-on-error: ${{ matrix.python_version == '3.16' }}
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.14", "3.15", "3.16"]
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    env:
      # Project-specific (prettyqt): headless Qt.
      DISPLAY: ":99.0"
      # QtWebEngine segfaults on headless Linux runners with GPU / sandbox enabled
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox"
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: tlambert03/setup-qt-libs@v1

      - name: Linux opengl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libpulse0 libva-drm2 libva-x11-2

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: py${{ matrix.python_version }}
          python-version: ${{ matrix.python_version }}

      # Project-specific (prettyqt): the Qt binding is an extra; test both bindings.
      - name: Install dependencies (PyQt6)
        run: uv sync --extra pyqt6 --extra addons --no-group docs

      # ruff comes from the pinned `lint` group, same version as pre-commit.
      - name: Check for code issues (ruff check)
        run: uv run --no-sync ruff check .

      - name: Check code format (ruff format)
        run: uv run --no-sync ruff format --check .

      # Project-specific (prettyqt): type-checked with mypy (not enforced, see AGENTS.md),
      # so no `ty check` step.

      - name: Run tests (PyQt6)
        uses: coactions/setup-xvfb@v1
        timeout-minutes: 10
        with:
          run: uv run --no-sync pytest

      - name: Install dependencies (PySide6)
        run: uv sync --extra pyside6 --extra addons --no-group docs

      - name: Run tests (PySide6)
        uses: coactions/setup-xvfb@v1
        timeout-minutes: 10
        with:
          run: uv run --no-sync pytest --doctest-modules --cov-report=xml --cov=prettyqt --cov-report=term-missing

      - name: Upload test results to Codecov
        # The upload sometimes hangs; never let it fail or block the build.
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  # Project-specific (prettyqt): docs are built on every push and deployed to gh-pages on tags.
  # Linux only: the docs build hangs on Windows runners (QtBluetooth section).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # push the docs to gh-pages
    env:
      DISPLAY: ":99.0"
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox"
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: tlambert03/setup-qt-libs@v1

      - name: Linux opengl
        run: sudo apt-get update && sudo apt-get install -y libegl1 libpulse0 libva-drm2 libva-x11-2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: docs

      - name: Install dependencies
        run: uv sync --extra pyside6 --extra addons

      - name: Build documentation
        # generating a page per class is slow
        uses: coactions/setup-xvfb@v1
        timeout-minutes: 40
        with:
          run: uv run --no-sync mknodes build

      - name: Deploy docs to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # this permission is mandatory for trusted publishing
      id-token: write
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the whole history, so the notes cover everything since the last tag

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: py${{ matrix.python_version }}

      - name: Build package
        run: uv build

      - name: Generate release notes
        # From the Conventional Commits since the previous tag (cliff.toml)
        run: uvx git-cliff --latest --strip header --output release-notes.md

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Release package on GitHub
        uses: ncipollo/release-action@v1
        with:
          bodyFile: release-notes.md
          artifacts: dist/*.whl,dist/*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
