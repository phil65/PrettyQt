#:tombi schema.strict = false

[project]
name = "PrettyQt"
version = "1.63.1"
description = "Pythonic layer on top of PyQt6 / PySide6, with extra widgets, models and tooling"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Philipp Temminghoff", email = "philipptemminghoff@gmail.com" },
]
keywords = [
  "components",
  "framework",
  "gui",
  "item-models",
  "pyqt6",
  "pyside6",
  "qt",
  "widgets",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Software Development :: Widget Sets",
  "Typing :: Typed",
]
dependencies = [
  # Only add below (Copier)
  # (no "prettyqt" / "pyside6" from the Qt answer: this is prettyqt, the binding is an extra)
  "anyenv>=0.4.6",
  "bidict",
  "comtypes;platform_system == 'Windows'",
  "packaging>=23.0",
  "pygments",
  "python-dateutil>=2.8",
  "pywin32;platform_system == 'Windows'",
  "qstylizer",
  "sublime-search>=0.1.2",
]

[project.urls]
Changelog = "https://github.com/phil65/PrettyQt/blob/main/CHANGELOG.md"
"Code coverage" = "https://app.codecov.io/gh/phil65/PrettyQt"
Documentation = "https://phil65.github.io/PrettyQt/"
Issues = "https://github.com/phil65/PrettyQt/issues"
Source = "https://github.com/phil65/PrettyQt"

[project.gui-scripts]
iconbrowser = "prettyqt.custom_widgets.iconbrowser:run"
regexeditor = "prettyqt.custom_widgets.regexeditor.__main__:run"

[project.entry-points.pyinstaller40]
hook-dirs = "prettyqt.__pyinstaller:get_hook_dirs"

[project.optional-dependencies]
addons = [
  "fsspec",
  "ipython",
  "lxml",
  "numpy",
  "orjson",
  "pillow",
  "pydantic>=2.11",
  "qtconsole",
]
pydantic = ["pydantic>=2.11"]
pyqt6 = ["PyQt6", "PyQt6-Charts", "PyQt6-Pdf", "PyQt6-WebEngine", "PyQt6-QScintilla"]
pyside6 = ["pyside6", "PySide6-Addons"]

[dependency-groups]
dev = [
  # Only add below (Copier)
  "coverage",
  "deptry",
  "devtools",
  "pyreadline3",
  "pytest",
  "pytest-cov",
  "pytest-qt",
  "pytest-xvfb;platform_system == 'Linux'",
]
benchmark = ["pyinstrument"]
docs = [
  # Only add below (Copier)
  "markdown-exec",
  "mkdocs",
  "mkdocs-glightbox",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mknodes>=4.0.0",
  "pymdown-extensions",
]
lint = [
  # Only add below (Copier)
  # Project-specific: prettyqt is type-checked with mypy (see AGENTS.md).
  "mypy",  # Pinned on purpose: CI, pre-commit and editors all run exactly these versions.
  # Bump them here (template) and roll out via `copier update`.
  "ruff==0.17.6",
  "ty==0.0.110",
  "types-Deprecated",
  "types-python-dateutil",
]

[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError",
  'if __name__ == "__main__":',
]

[tool.mknodes]
build-fn = "prettyqt.docs.gen_pages:build"
allowed-commit-types = [
  "fix",
  "feat",
  "refactor",
  "docs",
  "test",
  "build",
  "chore",
]
docstring-style = "google"

[tool.mypy]
python_version = "3.14"
disable_error_code = [
  "assignment",
  "misc",
  "attr-defined",
  "import",
  "misc",
  "attr-defined",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "basic"
deprecateTypingAliases = true
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnknownVariableType = false
reportAny = false
reportImplicitOverride = false
reportUnusedFunction = false
reportImplicitStringConcatenation = false
reportIgnoreCommentWithoutRule = false
reportUnannotatedClassAttribute = false
reportSelfClsParameterName = false
reportPrivateImportUsage = false

[tool.pytest]
# qt_api = "pyside6"
# No pytest-qt message capture: it swaps the Qt message handler before / after each
# test, which races with QtWebEngine's Chromium GPU thread logging asynchronously
# ("GPUInfo not initialized on GpuInfoUpdate"). PyQt6 then calls the already reset
# handler ("TypeError: 'NoneType' object is not callable" at teardown), PySide6
# calls a freed one (segfault). Qt messages still end up in pytest's captured stderr.
addopts = ["--no-qt-log"]
junit_family = "xunit2"
log_cli = true
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s %(levelname)s %(message)s"
minversion = "9.0"
testpaths = ["tests/"]
asyncio_mode = "auto"
qt_qapp_name = "prettyqt-test"

[tool.ruff]
line-length = 90
extend-exclude = ["docs", "prettyqt/qt/"]
target-version = "py314"

[tool.ruff.lint]
future-annotations = true
select = [
  "A",  # Flake8-builtins
  # "ANN",  # Flake8-Annotations
  # "ASYNC",  # Flake8-Async
  # "ARG",  # # Flake8-Unused-Arguments
  "B",  # flake8-bugbear
  "BLE",  # Flake8-blind-except
  "C",
  "C4",  # flake8-comprehensions
  # "C90",  # MCCabe
  "COM",  # Flake8-commas
  # "CPY",  #  Copyright-related rules
  "D",  # PyDocStyle
  # "DTZ",  # Flake8- Datetimez
  "E",  # PyCodeStyle Error
  "EM",  # flake8-errmsg
  # "ERA",  #  Eradicate
  "EXE",  # flake8-executable
  "F",  # PyFlakes
  "FA",  # flake8-future-annotations
  # "FBT",  # flake8-boolean-trap
  # "FIX",  # flake8-fixme
  "FLY",  # flynt
  "G",  # flake8-logging-format
  "I",  # ISort
  "ICN",  # Flake8-import-conventions
  "INP",  # flake8-no-pep420
  "INT",  # flake8-gettext
  "ISC",  # flake8-implicit-str-concat
  "N",  # pep8-naming
  # "NPY",  # numpy-specific rules
  # "PD",   # pandas-vet
  "PERF",  # perflint
  # "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PLE",  # PyLint Error
  "PLC",  # PyLint convention
  # "PLW",  # PyLint Warning
  "PLR",  # PyLint refactor
  "PT",  # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",  # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff-specific rules
  # "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "SLOT",  # flake8-slots
  # "T",
  # "TD",   # flake8-todos
  "T10",  # flake8-debugger
  # "T20",  # flake8-print
  "TC",  # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",  # PyUpgrade
  "W",  # PyCodeStyle warning
  "YTT",  # flake8-2020
]
ignore = [
  "C408",  # Unnecessary {obj_type} call (rewrite as a literal)
  "B905",  # zip() without an explicit strict= parameter
  "C901",  # {name} is too complex ({complexity} > {max_complexity})
  "COM812",
  # "CPY001", # Missing copyright notice at top of file
  "D100",  # Missing docstring in public module
  "D101",  # Missing docstring in public class
  "D102",  # Missing docstring in public method
  "D103",  # Missing docstring in public function
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic method
  "D106",  # Missing docstring in public nested class
  "D107",  # Missing docstring in __init__
  "D203",  # 1 blank line required before class docstring
  "D204",  # 1 blank line required after class docstring
  "D213",  # Multi-line docstring summary should start at the second line
  "D215",  # Section underline is over-indented ("{name}")
  "D400",  # First line should end with a period
  "D401",  # First line of docstring should be in imperative mood: "{first_line}"
  "D404",  # First word of the docstring should not be "This"
  "D406",  # Section name should end with a newline ("{name}")
  "D407",  # Missing dashed underline after section ("{name}")
  "D408",  # Section underline should be in the line following the section's name ("{name}")
  "D409",  # Section underline should match the length of its name ("{name}")
  "D413",  # Missing blank line after last section ("{name}")
  "EM101",  # Exception must not use a string literal, assign to variable first
  "EM102",  # Exception must not use an f-string literal, assign to variable first
  "ISC001",
  "PLC0415",
  "PLR0912",  # Too many branches
  "PLR0913",  # Too many arguments to function call
  "PLR0915",  # Too many statements
  "PLR0917",  # Too many positional arguments
  # "PLR2004", # Magic values instead of named consts
  "SLF001",  # Private member accessed
  "TRY003",  # Avoid specifying long messages outside the exception class
  "TC006",  # runtime-cast-value
  # Project-specific (Qt): overrides keep Qt's camelCase names.
  "N802",  # Function name should be lowercase
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "sqlalchemy.orm.DeclarativeBase",
  "schemez.Schema",
  "sqlmodel.SQLModel",
]
runtime-evaluated-decorators = [
  "pydantic.validate_call",
  "fastapi.FastAPI.get",
  "fastapi.FastAPI.post",
  "fastmcp.FastMCP.tool",
  "typer.Typer.command",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
# lines-between-types = 1
# atomic = true
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "I001"]
"scripts/*" = ["INP001"]
"*tests/*" = ["D100"]

[tool.ruff.format]
preview = true

[tool.ty.environment]
python-version = "3.14"
python-platform = "all"

[tool.ty.src]
# `ty check` (hooks, CI, editors) type-checks the package code only.
include = ["prettyqt"]

[tool.ty.analysis]
# Optional dependencies that are not always installed, e.g. "numpy", "numpy.**".
# Unresolved imports are errors otherwise, so broken imports are caught.
allowed-unresolved-imports = []

[tool.ty.rules]
# Narrowing an overridden class attribute (e.g. pydantic discriminators,
# `Config` attributes) is an intentional pattern.
incompatible-mutable-override = "ignore"

[tool.uv]
default-groups = ["dev", "lint", "docs"]

[tool.uv.build-backend]
# Project-specific: flat layout (package in prettyqt/, no src/).
module-root = ""
wheel-exclude = [
  ".mypy_cache/**",
  "__pycache__/**",
  "*.pyc",
  "*.pyo",
  ".pytest_cache/**",
  ".ruff_cache/**",
]
source-exclude = [
  ".mypy_cache/**",
  "__pycache__/**",
  "*.pyc",
  "*.pyo",
  ".pytest_cache/**",
  ".ruff_cache/**",
]
